<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 | pedersen.io</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #1f2937;
      background: #fbfbfb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top left, rgba(30, 64, 175, 0.12), transparent 25%),
                  radial-gradient(circle at bottom right, rgba(234, 179, 8, 0.12), transparent 20%),
                  #fbfbfb;
    }

    .page {
      max-width: 680px;
      width: min(95vw, 680px);
      padding: 3rem 2.5rem;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(15, 23, 42, 0.08);
      box-shadow: 0 28px 80px rgba(15, 23, 42, 0.08);
      text-align: left;
    }

    .eyebrow {
      font-size: 0.85rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: #6366f1;
      margin-bottom: 1rem;
    }

    h1 {
      font-size: clamp(2.35rem, 3.5vw, 3.75rem);
      line-height: 1.02;
      margin: 0 0 1rem;
      color: #111827;
    }

    p {
      margin: 0 0 1.8rem;
      font-size: 1.05rem;
      line-height: 1.8;
      color: #4b5563;
    }

    a.button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.95rem 1.6rem;
      border-radius: 999px;
      background: #4338ca;
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      margin: 1.75rem 0;
    }

    a.button:hover {
      transform: translateY(-1px);
      box-shadow: 0 18px 40px rgba(67, 56, 202, 0.18);
    }

    .hint {
      font-size: 0.95rem;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <article class="page">
    <div class="eyebrow">404 • Side ikke fundet</div>
    <h1>Hej! Ledte du efter <a class="button" href="https://www.pedersen.io">www.pedersen.io</a>?</h1>
    <p class="hint">Denne side findes ikke her, men du kan følge linket for at fortsætte til den rigtige adresse.</p>
  </article>
</body>
</html>
